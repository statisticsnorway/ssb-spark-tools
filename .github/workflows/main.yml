name: Platforms

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  tests:
    name: ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.13", os: "ubuntu-latest" }
          - { python: "3.13", os: "macos-latest" }
          - { python: "3.13", os: "windows-latest" }

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install poetry
        run: pipx install poetry==2.3.4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: "poetry"

      - run: poetry install --no-root

      - name: Run pytest
        run: |
          poetry run pytest --verbose --cov --cov-report=term --cov-report=xml --junitxml=pytest-report.xml
